<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1720">
<title>The Long Voyage</title>
<style>
:root{color-scheme:dark;--bg:#0b1820;--ink:#f1e7d1;--muted:#9caaa8;--edge:#304651;--accent:#eec88c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
main{max-width:740px;margin:auto;padding:34px 22px 70px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--edge);padding-bottom:21px}
h1{font-size:clamp(28px,6vw,45px);letter-spacing:-.045em;font-weight:400;margin:0}
#count{font:11px "Courier New",monospace;color:var(--accent);white-space:nowrap}
nav{display:flex;gap:22px;margin:22px 0 7px}
nav button{font:12px "Courier New",monospace;color:var(--muted);border:0;border-bottom:1px solid transparent;padding:7px 0;background:none;cursor:pointer}
nav button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
#list{list-style:none;margin:0;padding:0}
.book{display:grid;grid-template-columns:24px 1fr;gap:15px;align-items:start;border-bottom:1px solid var(--edge);padding:19px 0}
.book.done{opacity:.54}
.book.done .name{text-decoration:line-through;text-decoration-color:#8b9d99}
.tick{appearance:none;display:grid;place-items:center;width:18px;height:18px;margin:8px 0 0;border:1px solid #9bb6ad;border-radius:2px;background:transparent;cursor:pointer}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked:after{content:"✓";font:bold 13px sans-serif;color:var(--bg)}
.name{font-size:21px;line-height:1.3;font-weight:400;letter-spacing:-.01em;margin:0}
.name a{color:inherit;text-decoration:none}
.name a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--accent)}
.author{margin:5px 0 0;color:var(--muted);font-size:13px}
.tag{display:block;margin-top:7px;color:var(--accent);font:11px/1.45 "Courier New",monospace}
details{margin-top:10px}
summary{list-style:none;color:var(--muted);font:11px "Courier New",monospace;cursor:pointer;width:max-content;max-width:100%}
summary::-webkit-details-marker{display:none}
summary:before{content:"+ ";color:var(--accent)}
details[open] summary:before{content:"− "}
.quotelist{margin:10px 0 0;padding:0;list-style:none}
.quotelist li{color:#c8c9ba;font-size:13px;font-style:italic;line-height:1.6;margin:9px 0;padding-left:12px;border-left:1px solid var(--edge)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:450px){main{padding:27px 16px 65px}.name{font-size:19px}.book{gap:11px}}
</style>
</head>
<body>
<main>
<header><h1>The Long Voyage</h1><span id="count"></span></header>
<nav aria-label="Reading status">
<button type="button" data-filter="unread" aria-pressed="true">Unread</button>
<button type="button" data-filter="all" aria-pressed="false">All</button>
<button type="button" data-filter="read" aria-pressed="false">Finished</button>
</nav>
<ol id="list"></ol>
</main>
<script>
"use strict";

,"Shared universe · Standalone","https://www.goodreads.com/work/817527",["It is good to have an end…","To learn which questions are unanswerable…","The only thing that makes life possible…"]],["The Diamond Age","Neal Stephenson","","https://www.goodreads.com/work/2181158",["Intelligent people can handle subtlety.","They are not baffled by ambiguous…","We ignore the blackness of outer space…"]],["The Fountains of Paradise","Arthur C. Clarke","","https://www.goodreads.com/work/734510",["Politics is the science of the possible…","Instantly, there had been cries of protest…","There is something very strange about a universe…"]],["Neuromancer","William Gibson","Series start","https://www.goodreads.com/work/909457",["The sky above the port was the color…","Cyberspace. A consensual hallucination…","When the past is always with you…"]],["To Say Nothing of the Dog","Connie Willis","Shared universe · Standalone","https://www.goodreads.com/work/696",["Cats, as you know, are quite impervious to threats.","The reason Victorian society was so restricted…","One has not lived until one has carried…"]],["Forever Peace","Joe Haldeman","Standalone · Related theme only","https://www.goodreads.com/work/94590",["People had written about that, warfare based on attrition…","Some are born crazy…","But I decided that buying the gift was more for me…"]],["Among Others","Jo Walton","","https://www.goodreads.com/work/6449955",["It doesn't matter. I have books…","I'll belong to libraries wherever I go.","Libraries really are wonderful."]],["Cyteen","C. J. Cherryh","Series start","https://www.goodreads.com/book/show/834518",["He was Alpha, but he was young…","He had known, if the world was halfway…","Jane leaned back against the counter and stared…"]],["The Sparrow","Mary Doria Russell","Series start","https://www.goodreads.com/work/3349153",["I do what I do without hope of reward…","There's an old Jewish story that says…","The Jewish sages also tell us that God dances…"]],["The Windup Girl","Paolo Bacigalupi","","https://www.goodreads.com/work/6791425",["We are nature.","Politics is ugly.","Food should come from the place of its origin…"]],["The Snow Queen","Joan D. Vinge","Series start","https://www.goodreads.com/work/522872",["But what force in the galaxy is stronger…","Real power is control.","Indifference is the strongest force in the universe."]],["Where Late the Sweet Birds Sang","Kate Wilhelm","","https://www.goodreads.com/work/953721",[]],["Redshirts","John Scalzi","","https://www.goodreads.com/work/18130445",["We've already established whoever is writing us…","I don't care whether I really exist or don't…","Sooner or later the Narrative will come for each of us."]],["Stand on Zanzibar","John Brunner","","https://www.goodreads.com/work/2184253",["It's supposed to be automatic…","You don’t bother to memorise the literature…","True, you’re not a slave…"]],["Rainbows End","Vernor Vinge","","https://www.goodreads.com/work/3101132",["So much technology, so little talent.","While We are out of Touch…","But he would flail and flail…"]],["Red Mars","Kim Stanley Robinson","Series start","https://www.goodreads.com/work/40712",["Beauty is power and elegance…","Money equals power; power makes the law…","Most ignorance is by choice…"]],["When There Are Wolves Again","E. J. Swift","","https://www.goodreads.com/book/show/217490523",[]],["The Stone Sky","N. K. Jemisin","Sequel · Start: The Fifth Season","https://www.goodreads.com/work/52472813",["If you love someone, you don’t get to choose…","But there are none so frightened…","For a society built on exploitation…"]],["Timescape","Gregory Benford","","https://www.goodreads.com/work/2611291",["The Law of Controversy…","Passion is inversely proportional…","The universe of artifacts was a human one."]],["The Separation","Christopher Priest","","https://www.goodreads.com/book/show/1609727",[]],["Take Back Plenty","Colin Greenland","Series start","https://www.goodreads.com/book/show/1415743",[]],["Air","Geoff Ryman","","https://www.goodreads.com/work/250148",["He might as well have been talking English…","Once there was a dictator…","Heaven is a place where you cannot change…"]],["Paladin of Souls","Lois McMaster Bujold","Sequel · Start: The Curse of Chalion","https://www.goodreads.com/work/819610",["And the Bastard grant us…","Poets speak of hope in ladies smiles…","I'm not getting it all sorted…"]],["A Desolation Called Peace","Arkady Martine","Sequel · Start: A Memory Called Empire","https://www.goodreads.com/work/61309907",["She’s a barbarian, but don’t hold it against her.","It is the minds of a people…","But the habits of memory created…"]],["Barrayar","Lois McMaster Bujold","Sequel · Start: Shards of Honor","https://www.goodreads.com/work/3036422",["My home is not a place, it is people.","But pain… seems to me an insufficient reason…","I don't want power. I just object to idiots…"]],["Foundation's Edge","Isaac Asimov","Sequel · Start: Foundation","https://www.goodreads.com/work/1725527",["You show me someone who can't understand people…","The advance of civilization is nothing but an exercise…","There's nothing to it. All you have to do…"]],["Mirror Dance","Lois McMaster Bujold","Sequel · Start: Shards of Honor","https://www.goodreads.com/work/287351",["Since no one is perfect…","I do think, half of what we call madness…","It’s important that someone celebrate our existence…"]],["The Uplift War","David Brin","Sequel · Start: Sundiver","https://www.goodreads.com/work/98235",["Where subtlety fails us we must simply…","The best means to an end are not always…","But there is one more reason to protect other species…"]],["The Fall of Hyperion","Dan Simmons","Sequel · Start: Hyperion","https://www.goodreads.com/work/1882596",["In the end--when all else is dust…","I know what cancer was.","Mobs have passions, not brains."]],["Green Mars","Kim Stanley Robinson","Sequel · Start: Red Mars","https://www.goodreads.com/work/69059",["That's libertarians for you…","Look at the pattern this seashell makes…","You have to fight not only against what you hate…"]],["Blue Mars","Kim Stanley Robinson","Sequel · Start: Red Mars","https://www.goodreads.com/work/40711",["Economics was like psychology, a pseudoscience…","That is what capitalism is…","The intense desire to talk with someone…"]],["Ancillary Sword","Ann Leckie","Sequel · Start: Ancillary Justice","https://www.goodreads.com/work/40026175",["When they behave properly…","I find forgiveness overrated.","Eggs are so inadequate, don’t you think?"]],["There Is No Antimemetics Division","qntm","","https://www.goodreads.com/work/84995086",["Humans can walk away from, and forget, anything.","Ideas can be killed…","Welcome to the Antimemetics Division."]],["Blindsight","Peter Watts","Series start","https://www.goodreads.com/work/223813791",["Evolution has no foresight.","People aren't rational.","Stars, everywhere."]],["Ra","qntm","","https://www.goodreads.com/work/42136386",["Ra's locks had been changed…","Once you have physical access to the hardware…","I'm an engineer. You're the client."]]];
const canonical=["The Forever War","Dune","Hyperion","The Left Hand of Darkness","Forever Peace","Foundation's Edge","The Fall of Hyperion","There Is No Antimemetics Division","Blindsight","Ra"];
const storageKey="long-voyage-read-v4";
const read=new Set(canonical);
try{
 const prior=JSON.parse(localStorage.getItem(storageKey)||"null");
 if(Array.isArray(prior)){read.clear();for(const t of prior)if(books.some(b=>b[0]===t))read.add(t);}
 else{
  const legacy=JSON.parse(localStorage.getItem("long-voyage-read-v2")||"[]");
  if(Array.isArray(legacy))for(const t of legacy)if(books.some(b=>b[0]===t))read.add(t);
 }
}catch(e){}
let filter="unread";
const list=document.getElementById("list");
const create=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
function render(){
 list.replaceChildren();
 document.getElementById("count").textContent=read.size+" / "+books.length+" read";
 for(const [title,author,tag,url,quotes] of books){
  const done=read.has(title);
  if((filter==="unread"&&done)||(filter==="read"&&!done))continue;
  const item=create("li","book"+(done?" done":""));
  const box=create("input","tick");box.type="checkbox";box.checked=done;box.setAttribute("aria-label","Mark finished: "+title);
  box.addEventListener("change",()=>{
   if(box.checked)read.add(title);else read.delete(title);
   try{localStorage.setItem(storageKey,JSON.stringify([...read]));}catch(e){}
   render();
  });
  const text=create("div");
  const h=create("h2","name"),a=create("a","",title);
  a.href=url;a.target="_blank";a.rel="noopener noreferrer";
  h.append(a);text.append(h,create("p","author",author));
  if(tag)text.append(create("span","tag",tag));
  if(quotes.length){
   const details=create("details"),summary=create("summary","",quotes.length+" quote"+(quotes.length===1?"":"s"));
   const ul=create("ul","quotelist");
   for(const quote of quotes)ul.append(create("li","",quote));
   details.append(summary,ul);text.append(details);
  }
  item.append(box,text);list.append(item);
 }
}
for(const btn of document.querySelectorAll("[data-filter]")){
 btn.addEventListener("click",()=>{filter=btn.dataset.filter;for(const tab of document.querySelectorAll("[data-filter]"))tab.setAttribute("aria-pressed",String(tab===btn));render();});
}
render();
</script>
